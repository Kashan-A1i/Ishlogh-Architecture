<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="55%" stop-color="#efe5d2"/>
      <stop offset="100%" stop-color="#e3d2bc"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#d98e3a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d98e3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8c7a6b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a3e35" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#parchment)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- mountain silhouettes (Hindu Kush motif) -->
  <path d="M0 320 L0 250 L120 170 L190 215 L300 120 L380 190 L470 140 L560 220 L640 175 L760 245 L860 160 L960 230 L1060 150 L1200 240 L1200 320 Z" fill="url(#mtn)"/>
  <path d="M300 120 L330 145 L312 142 L300 150 L288 141 L272 143 Z M1060 150 L1085 172 L1070 169 L1060 176 L1050 168 L1037 171 Z" fill="#f7f2e7" opacity="0.7"/>

  <!-- small campfire -->
  <g transform="translate(150 255)">
    <path d="M0 0 C -14 -18, 4 -26, 0 -46 C 14 -30, 20 -16, 10 0 Z" fill="#b33939" opacity="0.85"/>
    <path d="M2 0 C -5 -10, 6 -16, 4 -28 C 12 -18, 12 -8, 8 0 Z" fill="#e6a23c"/>
    <rect x="-18" y="0" width="44" height="6" rx="3" fill="#4a3e35" transform="rotate(-8)"/>
    <rect x="-16" y="0" width="44" height="6" rx="3" fill="#63564c" transform="rotate(10)"/>
  </g>

  <!-- dotted border -->
  <rect x="14" y="14" width="1172" height="292" rx="12" fill="none" stroke="#8c7a6b" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.8"/>

  <text x="600" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#1a1613" letter-spacing="2">Ishlogh</text>
  <text x="600" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#4a3e35">Archiving the tales that shaped our region</text>
  <line x1="470" y1="210" x2="730" y2="210" stroke="#8c7a6b" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#63564c" letter-spacing="3">A DIGITAL FOLKLORE ARCHIVE  ·  TEXT  ·  AUDIO  ·  VIDEO</text>
</svg>
