<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1613"/>
      <stop offset="55%" stop-color="#26201b"/>
      <stop offset="100%" stop-color="#362c25"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#d98e3a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d98e3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3e35" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1613" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b241f"/>
      <stop offset="100%" stop-color="#14110f"/>
    </linearGradient>
  </defs>

  <!-- Base canvas -->
  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#warmGlow)"/>

  <!-- Subtle distant Hindu Kush ridge -->
  <path d="M0 280 L0 215 L110 165 L215 198 L340 135 L455 188 L585 148 L710 200 L845 140 L975 192 L1090 152 L1200 195 L1200 280 Z" fill="url(#ridgeBack)"/>

  <!-- Foreground ridge -->
  <path d="M0 280 L0 238 L165 195 L310 228 L490 182 L650 232 L815 188 L990 228 L1120 198 L1200 222 L1200 280 Z" fill="url(#ridgeFront)"/>

  <!-- Inner frame -->
  <rect x="16" y="16" width="1168" height="248" rx="10" fill="none" stroke="#8c7a6b" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Typography -->
  <text x="600" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#f4f0e6" letter-spacing="3">Ishlogh</text>
  <text x="600" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#e3d2bc" opacity="0.92">Archiving the oral folklore, myths, and legends of the mountain regions</text>

  <!-- Minimal divider -->
  <line x1="510" y1="174" x2="690" y2="174" stroke="#d98e3a" stroke-width="1.5" stroke-opacity="0.65"/>

  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b8a696" letter-spacing="3.5">WRITTEN TALES  ·  ORAL AUDIO  ·  VIDEO ARCHIVE</text>
</svg>
